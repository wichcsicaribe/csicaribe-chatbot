<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSI CARIBE - Panel</title>
<style>body{font-family:sans-serif;margin:0;display:flex;height:100vh} #left{width:320px;border-right:1px solid #ddd;overflow:auto;padding:10px} #right{flex:1;display:flex;flex-direction:column} #msgs{flex:1;overflow:auto;padding:15px} .chat{padding:10px;border-bottom:1px solid #eee;cursor:pointer} .chat b{display:block} input,button{padding:10px;border-radius:8px;border:1px solid #ddd} button{background:#25D366;border:0;cursor:pointer} .msg{margin:8px 0;padding:10px;background:#f0f0f0;border-radius:10px;max-width:80%}</style></head>
<body>
<div id="left"><h3>CSI CARIBE +</h3><input id="search" placeholder="Buscar..." oninput="loadChats()" style="width:90%"><div id="list"></div></div>
<div id="right">
<div style="padding:12px;border-bottom:1px solid #eee"><b id="curName">Elige un chat</b> <span id="curPhone"></span> <a id="curPost" target="_blank" style="display:none">Ver post 🔗</a></div>
<div id="msgs"></div>
<div style="display:flex;gap:8px;padding:10px"><input id="replyText" style="flex:1" placeholder="Escribe tu respuesta..."><button onclick="sendReply()">Enviar ➤</button></div>
</div>
<script>
let chats=[], cur=null;
async function loadChats(){
  const r=await fetch('/api/messages'); chats=await r.json();
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=chats.filter(c=>(c.name+c.phone).toLowerCase().includes(q));
  document.getElementById('list').innerHTML=f.map((c,i)=>`<div class="chat" onclick="openChat(${chats.indexOf(c)})"><b>${c.name||'Sin nombre'}</b><small>${c.phone}</small><div>${c.lastMessage||''}</div></div>`).join('');
}
async function openChat(i){
  cur=chats[i]; document.getElementById('curName').innerText=cur.name; document.getElementById('curPhone').innerText=cur.phone;
  const a=document.getElementById('curPost'); if(cur.post_url){a.style.display='inline'; a.href=cur.post_url;} else a.style.display='none';
  const r=await fetch('/api/messages?phone='+cur.phone); const msgs=await r.json();
  document.getElementById('msgs').innerHTML=msgs.map(m=>`<div class="msg" style="${m.dir==='out'?'background:#dcf8c6;margin-left:auto':''}">${m.text}</div>`).join('');
}
async function sendReply(){
  const t=document.getElementById('replyText').value; if(!t||!cur) return alert('Elige un chat');
  const r=await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:cur.phone, text:t})});
  const j=await r.json(); if(j.ok){ document.getElementById('msgs').innerHTML+=`<div class="msg" style="background:#dcf8c6;margin-left:auto">${t}</div>`; document.getElementById('replyText').value=''; } else alert('Error');
}
loadChats();
</script></body></html>
